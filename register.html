{% extends "base.html" %}{% block title %}Register | DaanaSetu{% endblock %}{% block content %}
<div class="auth-wrap"><div class="auth-card wide"><span class="eyebrow">JOIN THE COMMUNITY</span><h2>Create your account</h2><form method="post" class="row g-3">
<div class="col-md-6"><label class="form-label">Full name / representative name *</label><input class="form-control" name="name" required></div>
<div class="col-md-6"><label class="form-label">Email *</label><input class="form-control" type="email" name="email" required></div>
<div class="col-md-6"><label class="form-label">Password * (minimum 8 characters)</label><input class="form-control" type="password" name="password" minlength="8" required></div>
<div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" name="phone"></div>
<div class="col-md-6"><label class="form-label">Role *</label><select class="form-select" name="role" id="role" onchange="toggleNgo()" required><option value="donor">Donor</option><option value="ngo">NGO representative</option><option value="volunteer">Volunteer</option></select></div>
<div class="col-md-6"><label class="form-label">City / service area *</label><input class="form-control" name="area" required placeholder="e.g. Bengaluru"></div>
<div id="ngo-fields" class="row g-3 mt-1" style="display:none"><div class="col-md-6"><label class="form-label">Organization name *</label><input class="form-control" name="organization_name"></div><div class="col-md-6"><label class="form-label">Registration number *</label><input class="form-control" name="registration_no"></div><div class="col-12"><label class="form-label">Organization description</label><textarea class="form-control" name="description"></textarea></div></div>
<div class="col-12"><button class="btn btn-primary w-100">Create account</button></div></form><p class="mt-3 muted">Already registered? <a href="{{ url_for('login') }}">Login</a></p><p class="small muted">NGO accounts are pending until an administrator reviews the submitted details.</p></div></div>{% endblock %}
