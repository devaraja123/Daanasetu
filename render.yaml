services:
  - type: web
    name: daanasetu
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_DEMO_DATA
        value: false
